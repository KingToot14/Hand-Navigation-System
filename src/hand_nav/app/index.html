<!DOCTYPE html>

<html>
    <head>
        <title>Hand Nav</title>
        <link rel='stylesheet' href='style.css'/>
        <script src="script.js"></script>
        <link rel="icon" type="image/x-icon" href='images/icon.svg'>
    </head>

    <body>
        <!-- Header -->
        <div id='header'>
            <img src='images/icon.svg' alt='icon'>
            <span>Hand Nav</span>

            <div id='nav-bar'>
                <span onclick="show_panel('general')">General</span>
                <span onclick="show_panel('navigation')">Navigation</span>
                <span onclick="show_panel('gamepad')">Gamepad</span>
            </div>
        </div>

        <div id='body'>
            <!-- General -->
            <div id='general' style="display: block;">
                <h1>General</h1>
                
                
            </div>
            
            <!-- Standard Navigation -->
            <div id='navigation' style="display: none;">
                <h1>Navigation</h1>
                
                <span class='button' id='nav-button' onclick="standard_nav()">Start Capture</span>

                <h2>Settings</h2>
            </div>
            
            <!-- Gamepad -->
            <div id='gamepad' style="display: none;">
                <h1>Gamepad</h1>
                
                <span class='button' id='gamepad-button' onclick="gamepad()">Start Capture</span>

                <h2>Settings</h2>

                <h3>Bindings</h3>

                <div class='two-column'>
                    <div id='gamepad-bindings-left'></div>
                    <div id='gamepad-bindings-right'></div>
                </div>
            </div>
        </div>
    </body>
</html>
